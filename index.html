<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La date</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f0f14;
      color: #f5f5f5;
      text-align: center;
      padding: 16px;
    }
    h1 { font-size: 1.25rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; }
    #jour {
      font-size: clamp(5rem, 25vw, 14rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(90deg, #ff3c78, #ffb238, #3cf0a0, #3c9bff, #b23cff, #ff3c78);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: couleur 6s linear infinite;
    }
    #details { font-size: 1.1rem; opacity: 0.8; }
    @keyframes couleur {
      from { background-position: 0% 50%; }
      to   { background-position: 300% 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      #jour { animation: none; }
    }
  </style>
</head>
<body>
  <h1>Bonjour</h1>
  <div id="jour">–</div>
  <p id="details"></p>
  <script src="script.js"></script>
</body>
</html>
